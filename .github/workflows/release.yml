name: Release

# 打 tag（v*）即触发：三端并行构建桌面版，并把产物上传到同名 GitHub Release。
# - macOS：dmg/zip（arm64 + x64）
# - Windows：NSIS 安装包（x64）
# - Linux：AppImage/deb（arm64，树莓派 64 位专用；原生模块在 arm64 runner 上原生编译）
# 也可在 Actions 页面手动触发（用 package.json 里的版本号建 Release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package Windows app and publish GitHub Release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package macOS app and publish GitHub Release
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux-arm64:
    # 树莓派（Pi 3/4/5，64 位系统）用：arm64 原生 runner 上构建，
    # 保证 better-sqlite3 这类原生模块按目标架构编译。
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package Linux arm64 app and publish GitHub Release
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
